<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoSign</title>
  <link rel="icon" href="https://raw.githubusercontent.com/NeoSigniOS/assets/main/LightDarkColor.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary-bg: #0a0a0a;
      --secondary-bg: #1a1a1a;
      --accent-blue: #0071e3;
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --border-radius: 14px;
    }
    
    /* Animation keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes glowPulse {
      0% { text-shadow: 0 0 10px rgba(255, 45, 85, 0.2); }
      50% { text-shadow: 0 0 20px rgba(255, 45, 85, 0.5); }
      100% { text-shadow: 0 0 10px rgba(255, 45, 85, 0.2); }
    }
    
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--primary-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }
    
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 20px;
      flex: 1;
    }
    
    .logo {
      width: 180px;
      height: 180px;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0, 113, 227, 0.25);
      transition: transform 0.5s ease;
    }
    
    .logo:hover {
      transform: scale(1.05);
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .neo-title {
      display: inline-block;
      font-size: 90px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #FF2D55, #FF9500, #5856D6, #FF2D55);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeIn 1.2s ease forwards, gradient 8s ease infinite, glowPulse 2s infinite alternate;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 18px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 40px;
      max-width: 600px;
      line-height: 1.5;
      letter-spacing: 0.007em;
    }
    
    .button-group {
      display: flex;
      gap: 20px;
      margin-bottom: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 32px;
      border-radius: var(--border-radius);
      font-weight: 600;
      font-size: 17px;
      transition: all 0.3s ease;
      min-width: 200px;
    }
    
    .button i {
      margin-right: 10px;
      font-size: 20px;
    }
    
    .button.primary {
      background: linear-gradient(135deg, #5865F2, #4752c4);
      color: white;
      border: none;
    }
    
    .button.primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
    }
    
    .button.secondary {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .button.secondary:hover {
      background-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    
    .footer {
      background-color: var(--secondary-bg);
      padding: 40px 24px;
      border-radius: var(--border-radius) var(--border-radius) 0 0;
      margin-top: auto;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    
    .support-text {
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-size: 18px;
      line-height: 1.5;
    }
    
    .support-text strong {
      color: var(--text-primary);
      background: linear-gradient(to right, #FF2D55, #FF9500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .social-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      background: linear-gradient(135deg, #5865F2, #4752c4);
      color: white;
      border-radius: var(--border-radius);
      font-weight: 600;
      transition: all 0.3s ease;
      margin-bottom: 24px;
    }
    
    .social-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
    }
    
    .social-button i {
      margin-right: 10px;
      font-size: 20px;
    }
    
    .copyright {
      color: var(--text-secondary);
      font-size: 15px;
    }
    
    @media (max-width: 640px) {
      .hero-section {
        padding: 80px 16px;
      }
      
      .logo {
        width: 150px;
        height: 150px;
      }
      
      h1 {
        font-size: 60px;
      }
      
      .subtitle {
        font-size: 16px;
      }
      
      .button-group {
        flex-direction: column;
        width: 100%;
      }
      
      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero-section">
      <div class="logo">
        <img src="https://raw.githubusercontent.com/NeoSigniOS/assets/main/LightDarkColor.png" alt="NeoSigner Logo">
      </div>
      <h1 class="neo-title">NeoSign</h1>
      <p class="subtitle" style="font-size: 16px; max-width: 500px; animation: fadeIn 1s 0.5s both;">Buy a certificate with 100% risk free and Sign your iOS Applications with Ease.</p>
      <div class="button-group">
        <a href="https://discord.gg/MhhydftA2u" class="button primary">
          <i class="fab fa-discord"></i>
          Join Discord
        </a>
        <a href="https://sign.neosign.dev/" class="button secondary">
          <i class="fas fa-file-signature"></i>
          Sign IPA
        </a>
      </div>
    </section>
  </div>
  
  <div class="footer">
    <p class="support-text">
      Need a certificate or have questions?
      <strong>Join our Discord community</strong> for support and updates.
    </p>
    <a href="https://discord.gg/MhhydftA2u" class="social-button discord-button">
      <i class="fab fa-discord"></i>
      Join Discord
    </a>
    <div class="copyright">© 2025 NeoSigner. All rights reserved.</div>
  </div>
</body>
</html>
